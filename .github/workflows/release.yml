name: Release build

# Builds the native codegen (native/) for every platform for a `v*` tag, into
# a DRAFT release. Nothing here publishes: scripts/release.sh, run on the
# release machine, checks each binary and publishes them to npm.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): one per architecture serves
          # glibc distributions and Alpine alike.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: vue-check-codegen-linux-x64, zig: true, runs: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: vue-check-codegen-linux-arm64, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: vue-check-codegen-darwin-arm64, runs: true }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: vue-check-codegen-darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: vue-check-codegen-windows-x64.exe, runs: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: vue-check-codegen-windows-arm64.exe }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches package.json and Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          package=$(sed -n 's/^\t"version": "\(.*\)",/\1/p' ../package.json | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not v$version (Cargo.toml)"; exit 1; }
          [ "$package" = "$version" ] || { echo "package.json is $package, Cargo.toml is $version"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        env:
          # Windows: link the C runtime statically, so the binary needs no
          # Visual C++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
          suffix=""; case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/vue-check-codegen$suffix" "dist/${{ matrix.asset }}"
      - name: It runs here and generates a file
        if: matrix.runs
        shell: bash
        run: |
          printf '%s\n' '{"file":"a.vue","text":"<script setup lang=\"ts\">\nconst a = 1\n</script>\n<template>{{ a }}</template>\n","typesPath":"x","target":3.5}' \
            | "dist/${{ matrix.asset }}" generate | grep -q '"generated"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: native/dist/${{ matrix.asset }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release (published by scripts/release.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "vue-check $GITHUB_REF_NAME" --notes "Draft: awaiting scripts/release.sh." dist/*
